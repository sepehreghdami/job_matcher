[project]
name = "job-matcher"
version = "0.1.0"
description = "Scrapes Telegram channels for job posts, scores them against resumes via an LLM, and forwards matches through a Telegram bot."
requires-python = ">=3.12"
dependencies = [
    "apscheduler==3.11.2",
    "openai==2.40.0",
    "openai-agents==0.17.4",
    "psycopg2==2.9.12",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pymupdf==1.28.0",
    "pypdf==6.14.2",
    "pysocks==1.7.1",
    "python-telegram-bot==22.7",
    "sqlalchemy==2.0.49",
    "telethon==1.43.2",
]
